<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Empire 👑 Mobile</title>
<style>
body {
  margin:0; font-family:Verdana,sans-serif; background:#111; color:#fff; 
  display:flex; flex-direction:column; align-items:center;
}
header { background:#222; width:100%; padding:10px; text-align:center;}
h1 { margin:0; font-size:24px; color:gold; text-shadow:0 0 5px #fff;}
#game { width:95%; max-width:400px; display:flex; flex-direction:column; align-items:center; margin-top:10px;}
button {
  margin:5px; padding:10px 15px; font-size:16px; cursor:pointer; border:none; border-radius:5px; 
  background:gold; color:#111;
}
button:active { background:#ff0;}
#stats { width:100%; display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;}
.progress-bar { background:#333; border-radius:5px; width:100%; height:16px; margin:5px 0; overflow:hidden;}
.progress { background:gold; height:100%; width:0%;}
#feed, #missions { background:#222; width:100%; max-height:120px; overflow-y:auto; margin:5px 0; padding:5px; font-size:12px; border-radius:5px;}
.mission { margin:2px 0; padding:2px; border-radius:3px; background:#333;}
#boss { background:#800; height:60px; width:100%; margin:10px 0; border-radius:5px; position:relative; overflow:hidden;}
#bossHealth { background:gold; height:100%; width:100%; border-radius:5px;}
#coinsContainer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
.sprite { width:32px; height:32px; image-rendering:pixelated; position:absolute; }
</style>
</head>
<body>
<header>
<h1>Pixel Empire 👑</h1>
</header>

<div id="game">
<div id="stats">
<p>Moedas: <span id="coins">0</span></p>
<p>Gemas: <span id="gems">0</span></p>
<p>Nível: <span id="level">1</span></p>
<p>Prestígio: <span id="prestige">0</span></p>
</div>

<button id="clickBtn">💰 Coletar Moedas</button>
<button id="upgradeBtn">⬆️ Upgrade (+1/moeda)</button>
<button id="autoBtn">🤖 Automatizar (5 gemas)</button>
<button id="prestigeBtn">👑 Prestígio</button>

<div class="progress-bar"><div id="xpBar" class="progress"></div></div>
<p>XP: <span id="xp">0</span>/100</p>

<h3>Missões Diárias</h3>
<div id="missions"></div>

<h3>Feed</h3>
<div id="feed"></div>

<div id="coinsContainer"></div>

<h3>Minigame: Chefão</h3>
<div id="boss">
<div id="bossHealth"></div>
</div>
<button id="hitBoss">Atacar!</button>

<h3>Talentos</h3>
<button data-buff="coin" class="talentBtn">💰 +1/moeda (5 gemas)</button>
<button data-buff="xp" class="talentBtn">✨ XP +1 (5 gemas)</button>
<button data-buff="auto" class="talentBtn">🤖 Auto +1 (5 gemas)</button>

<h3>Gacha</h3>
<button id="gachaBtn">Abrir Lootbox (3 gemas)</button>
<p id="gachaResult"></p>

<h3>Skins</h3>
<button data-skin="click" class="skinBtn">Clique Skin</button>
<button data-skin="boss" class="skinBtn">Chefão Skin</button>

<h3>Ranking Local</h3>
<ol id="rankList"></ol>
</div>

<script>
// --- GAME STATE ---
let coins=0, gems=0, level=1, xp=0, prestige=0;
let coinPerClick=1, autoCoins=0;
let bossHealth=100, bossMax=100;
let clickCount=0, bossHits=0;
let missions=[{desc:"Colete 50 moedas", goal:50, done:false},{desc:"Clique 100 vezes", goal:100, done:false},{desc:"Ataque o chefão 10 vezes", goal:10, done:false}];
let talents={coin:0,xp:0,auto:0};
let skinsUnlocked={click:false,boss:false};
let ranking=[{name:"Player",score:0}];
let maxParticles=10, particleCount=0;

// --- ELEMENTS ---
const coinsEl=document.getElementById('coins');
const gemsEl=document.getElementById('gems');
const levelEl=document.getElementById('level');
const xpEl=document.getElementById('xp');
const xpBar=document.getElementById('xpBar');
const prestigeEl=document.getElementById('prestige');
const missionsEl=document.getElementById('missions');
const feedEl=document.getElementById('feed');
const bossEl=document.getElementById('bossHealth');
const rankList=document.getElementById('rankList');
const gachaResult=document.getElementById('gachaResult');
const coinsContainer=document.getElementById('coinsContainer');

// --- FUNCTIONS ---
function updateStats(){
    coinsEl.textContent=coins;
    gemsEl.textContent=gems;
    levelEl.textContent=level;
    xpEl.textContent=xp;
    xpBar.style.width=xp+'%';
    prestigeEl.textContent=prestige;
    missionsEl.innerHTML='';
    missions.forEach(m=>missionsEl.innerHTML+=`<div class="mission">${m.desc} - ${m.done?"✅":"❌"}</div>`);
    ranking[0].score=coins; ranking.sort((a,b)=>b.score-a.score); rankList.innerHTML=''; ranking.forEach(r=>{const li=document.createElement('li'); li.textContent=`${r.name}: ${r.score}`; rankList.appendChild(li);});
}
function addFeed(text){const p=document.createElement('p'); p.textContent=text; feedEl.prepend(p); if(feedEl.children.length>15) feedEl.removeChild(feedEl.lastChild);}
function gainXP(amount){xp+=amount; if(xp>=100){xp-=100; level++; addFeed(`✨ Subiu para nível ${level}!`);}}
function checkMissions(){missions.forEach(m=>{if(!m.done){if((m.desc.includes("moedas")&&coins>=m.goal)||(m.desc.includes("Clique")&&clickCount>=m.goal)||(m.desc.includes("chefão")&&bossHits>=m.goal)){m.done=true; gems+=5; addFeed(`🎉 Missão completa: ${m.desc} - +5 gemas`);}}});}
function bossReset(){bossMax=100+level*10; bossHealth=bossMax; bossEl.style.width='100%';}
function spawnParticle(x,y){if(particleCount>=maxParticles) return; particleCount++; const p=document.createElement('div'); p.className='sprite'; p.style.left=x+'px'; p.style.top=y+'px'; coinsContainer.appendChild(p); setTimeout(()=>{p.remove(); particleCount--;},500);}

// --- EVENTS ---
document.getElementById('clickBtn').addEventListener('touchstart',e=>{e.preventDefault(); coins+=coinPerClick+talents.coin; clickCount++; gainXP(1+talents.xp); const x=e.touches[0].clientX; const y=e.touches[0].clientY; addFeed(`💰 Ganhou ${coinPerClick+talents.coin} moedas!`); spawnParticle(x,y); checkMissions(); updateStats();});
document.getElementById('upgradeBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(coins>=10){coins-=10; coinPerClick++; addFeed(`⬆️ Upgrade comprado! Cada clique vale ${coinPerClick} moedas`);}else addFeed("❌ Moedas insuficientes.");});
document.getElementById('autoBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(gems>=5){gems-=5; autoCoins=1; addFeed("🤖 Automatização comprada!"); updateStats();}else addFeed("❌ Gemas insuficientes.");});
document.getElementById('prestigeBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(level>=10){prestige++; coins=0; gems=0; level=1; xp=0; coinPerClick=1; autoCoins=0; clickCount=0; bossHits=0; bossReset(); addFeed(`👑 Prestígio alcançado! Total de prestígio: ${prestige}`); updateStats();}else addFeed("❌ Alcance nível 10 para Prestígio.");});
document.getElementById('hitBoss').addEventListener('touchstart',e=>{e.preventDefault(); let damage=coinPerClick*2+talents.coin; bossHealth-=damage; bossHits++; if(bossHealth<=0){coins+=10+talents.coin; gems+=1; addFeed("🔥 Chefão derrotado! +10 moedas e 1 gema"); bossReset(); bossHits=0;} bossEl.style.width=(bossHealth/bossMax)*100+'%'; checkMissions(); updateStats();});
document.querySelectorAll('.talentBtn').forEach(btn=>{btn.addEventListener('touchstart',e=>{e.preventDefault(); let buff=btn.dataset.buff; if(gems>=5){gems-=5; talents[buff]++; addFeed(`💡 Talento ${buff} adquirido!`); updateStats();}else addFeed("❌ Gemas insuficientes para talento.");});});
document.getElementById('gachaBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(gems>=3){gems-=3; let reward=Math.random(); if(reward<0.5){coins+=10+talents.coin; gachaResult.textContent="🎉 Ganhou 10 moedas!";} else if(reward<0.8){gems+=2; gachaResult.textContent="💎 Ganhou 2 gemas!";} else {talents.coin++; gachaResult.textContent="💡 Ganhou talento bônus de moedas!";} updateStats();}else gachaResult.textContent="❌ Gemas insuficientes!";});
document.querySelectorAll('.skinBtn').forEach(btn=>{btn.addEventListener('touchstart',e=>{e.preventDefault(); let skin=btn.dataset.skin; skinsUnlocked[skin]=!skinsUnlocked[skin]; addFeed(`✨ Skin ${skin} ${skinsUnlocked[skin]?"ativada":"desativada"}`);});});

// --- AUTO COINS ---
setInterval(()=>{coins+=autoCoins+talents.auto; if(autoCoins>0) addFeed(`🤖 Automatização gerou ${autoCoins+talents.auto} moedas.`); gainXP(autoCoins+talents.auto); checkMissions(); updateStats();},7000);

// --- RANDOM EVENTS ---
setInterval(()=>{let chance=Math.random(); if(chance<0.07){let bonus=5+Math.floor(Math.random()*5); coins+=bonus; addFeed(`🎁 Evento surpresa! Ganhou ${bonus} moedas`); updateStats();}},20000);

// --- INIT ---
bossReset(); updateStats();
</script>
</body>
</html>
